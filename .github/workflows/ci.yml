name: ci

# Fast, reliable CI. Installs only the lightweight deps and runs the tests that
# don't need the CAD kernel. test_cad self-skips when cadquery isn't installed,
# so we DON'T pay for a slow/flaky conda + OpenCascade solve on every push.
# The CAD path is exercised locally via environment.yml (conda).

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install light deps (no CAD kernel)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: App boots without the CAD kernel
        run: python -c "import app.main; print('app imports OK')"

      - name: Run tests (storage + schema full; CAD self-skips)
        run: pytest -q
